name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools
        run: npm install --ignore-scripts
      - name: Check syntax and behavior
        run: |
          npm run check
          npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the loaded extension
        env:
          CHROMIUM_PATH: ''
        run: npm run test:browser
      - name: Upload Chrome, Firefox and source packages
        uses: actions/upload-artifact@v4
        with:
          name: instagram-quiet-packages
          path: dist/*.zip
          if-no-files-found: error
