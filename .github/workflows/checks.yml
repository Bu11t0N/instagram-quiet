name: Build and unit checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Run experimental Chromium integration tests (setup currently blocked)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools
        run: npm install --ignore-scripts
      - name: Check syntax and behavior
        run: |
          npm run check
          npm test
      - name: Build Chrome and Firefox packages
        run: npm run build
      - name: Install Chromium
        if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
        run: npx playwright install --with-deps chromium
      - name: Test the loaded extension
        if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
        env:
          CHROMIUM_PATH: ''
          HEADED: '1'
        run: xvfb-run --auto-servernum npm run test:browser
      - name: Upload Chrome, Firefox and source packages
        uses: actions/upload-artifact@v4
        with:
          name: instagram-quiet-packages
          path: dist/*.zip
          if-no-files-found: error
